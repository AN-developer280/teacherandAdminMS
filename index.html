<!DOCTYPE html>
<html lang="en"><head>

<title>IAFMP Portal</title>

</head><body>

  <h1 class="text-xl font-semibold text-blue-900 mb-1">Integrated Administrative and Faculty Management Portal</h1>

<script>
  document.getElementById("reset").onclick = () => { localStorage.removeItem(IAFMP.K.KEY); alert("Demo data reset."); };
</script>
